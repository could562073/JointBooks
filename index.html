<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <!--
      像原生 App 一樣整頁不縮放（使用者要求）：iPhone 在輸入框字小於 16px 時會自動放大、之後不縮回，
      maximum-scale=1 擋掉這個自動放大；user-scalable=no 讓主畫面 App 不能雙指縮放
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FFF6EC" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>饅頭記帳</title>
    <!-- 樣式與程式載入前的第一個畫面就用啟動畫面的淡紫（--c-tint），打開時不會先閃一下白色 -->
    <style>html { background: #EDE9FA; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
