# 登入端點（Cloudflare Worker）。部署步驟見同一層的 README.md。
#
# 這裡只放公開資訊：用戶端 ID 與允許呼叫的網址。
# 用戶端密碼用 `npx wrangler secret put GOOGLE_CLIENT_SECRET` 設定，不進版控。

name = "jointbooks-auth"
main = "index.ts"
compatibility_date = "2026-09-15"

[vars]
# 跟 App 用同一個 OAuth 用戶端 ID（公開資訊，前端本來就看得到）
GOOGLE_CLIENT_ID = ""
# 允許呼叫這支端點的來源，逗號分隔。正式網址與本機開發各一個
ALLOWED_ORIGINS = "https://could562073.github.io,http://localhost:5173,http://localhost:5174"
